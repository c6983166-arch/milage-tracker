plugins { id 'com.android.application' }

android {
    namespace 'com.baileyanns.mileage'
    compileSdk 35

    defaultConfig {
        applicationId 'com.baileyanns.mileage.v14'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '1.5.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
