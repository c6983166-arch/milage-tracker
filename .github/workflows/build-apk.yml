name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing folder
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: bailey-anns-mileage-signing-v14

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore approved Bailey Ann's app icon
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d brand_assets/ba_i1_navy_gold_app_icon.b64 > app/src/main/res/drawable-nodpi/ba_i1_navy_gold_app_icon.webp
          test -s app/src/main/res/drawable-nodpi/ba_i1_navy_gold_app_icon.webp
          test -s app/src/main/res/drawable-nodpi/ba_l2_shiny_gold_logo.webp

      - name: Apply approved Miles Tracker update
        shell: bash
        run: |
          python3 premium_patch.py
          python3 v15_patch.py
          python3 v153_patch.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Bailey_Anns_Miles_Tracker_v1.5.3_SYNC_OPTIONAL_TRANSPARENT_LOGO.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Bailey_Anns_Miles_Tracker_v1.5.3_SYNC_OPTIONAL_TRANSPARENT_LOGO
          path: Bailey_Anns_Miles_Tracker_v1.5.3_SYNC_OPTIONAL_TRANSPARENT_LOGO.apk
          if-no-files-found: error

      - name: Publish verified APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: miles-tracker-v1.5.3
          name: Bailey Ann's Miles Tracker v1.5.3
          body: Business Manager sync is optional for Estate Miles. Manual Estate/Client entry is available. BA-L2 shiny gold logo uses a transparent background on navy screens. Launcher icon remains the worksheet-selected BA-I1 icon.
          files: Bailey_Anns_Miles_Tracker_v1.5.3_SYNC_OPTIONAL_TRANSPARENT_LOGO.apk
