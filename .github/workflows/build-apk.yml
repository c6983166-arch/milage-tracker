name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing folder
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: bailey-anns-mileage-signing-v14

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Apply approved premium layout
        shell: bash
        run: |
          python3 premium_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle')
          s=p.read_text()
          s=s.replace("applicationId 'com.baileyanns.mileage.v13'","applicationId 'com.baileyanns.mileage.v14'")
          s=s.replace('versionCode 3','versionCode 5')
          s=s.replace("versionName '1.2'","versionName '1.4'")
          p.write_text(s)
          x=Path('app/src/main/res/values/strings.xml')
          t=x.read_text().replace("Bailey Ann\\'s Mileage Tracker v1.3","Bailey Ann\\'s Miles Tracker v1.4")
          x.write_text(t)
          PY

      - name: Render approved Miles Tracker icon
        shell: bash
        run: |
          if command -v magick >/dev/null 2>&1; then
            magick -background none premium_icon.svg -resize 512x512 app/src/main/res/drawable-nodpi/miles_tracker_icon.webp
          elif command -v convert >/dev/null 2>&1; then
            convert -background none premium_icon.svg -resize 512x512 app/src/main/res/drawable-nodpi/miles_tracker_icon.webp
          else
            echo "ImageMagick is not available on this runner."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Bailey_Anns_Miles_Tracker_v1.4_OPTION_3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Bailey_Anns_Miles_Tracker_v1.4_OPTION_3
          path: Bailey_Anns_Miles_Tracker_v1.4_OPTION_3.apk
          if-no-files-found: error
