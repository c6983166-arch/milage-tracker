name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, miles-tracker-v1-5-update ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing folder
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: bailey-anns-mileage-signing-v14

      - name: Ensure stable debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore approved Bailey Ann's brand assets
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d brand_assets/ba_l2_shiny_gold_logo.b64 > app/src/main/res/drawable-nodpi/ba_l2_shiny_gold_logo.webp
          base64 -d brand_assets/ba_i1_navy_gold_app_icon.b64 > app/src/main/res/drawable-nodpi/ba_i1_navy_gold_app_icon.webp
          test -s app/src/main/res/drawable-nodpi/ba_l2_shiny_gold_logo.webp
          test -s app/src/main/res/drawable-nodpi/ba_i1_navy_gold_app_icon.webp

      - name: Apply approved Miles Tracker update
        shell: bash
        run: |
          python3 premium_patch.py
          python3 v15_patch.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Bailey_Anns_Miles_Tracker_v1.5_MANUAL_BRAND_UPDATE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Bailey_Anns_Miles_Tracker_v1.5_MANUAL_BRAND_UPDATE
          path: Bailey_Anns_Miles_Tracker_v1.5_MANUAL_BRAND_UPDATE.apk
          if-no-files-found: error
