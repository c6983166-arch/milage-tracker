name: Build Hidden Treasures Label Printer APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/hidden-treasures-label-printer-v1.3.2
    paths:
      - 'ht-label-printer-v1.2/**'
      - '.github/workflows/build-hidden-treasures-label-printer.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact v1.3.2 signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hidden-treasures-label-printer-signing-key-v1
          fail-on-cache-miss: true

      - name: Require restored signing key
        run: test -f "$HOME/.android/debug.keystore"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build v1.3.3 APK
        working-directory: ht-label-printer-v1.2
        run: gradle --no-daemon assembleDebug

      - name: Verify package identity and version
        run: |
          APK=ht-label-printer-v1.2/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep "package: name='com.hiddentreasures.htlabelprinter' versionCode='7' versionName='1.3.3'" /tmp/badging.txt
          grep "launchable-activity: name='com.hiddentreasures.labelprinter.MainActivityV133'" /tmp/badging.txt
          grep "sdkVersion:'26'" /tmp/badging.txt

      - name: Verify APK alignment
        run: |
          APK=ht-label-printer-v1.2/app/build/outputs/apk/debug/app-debug.apk
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

      - name: Verify exact v1.3.2 signing certificate
        run: |
          APK=ht-label-printer-v1.2/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/signature.txt
          grep "V2 Signer: certificate SHA-256 digest: 6bbd4dc024c19bda7bd88953ae0c3603e1255901ee7e729b8129a1efb0f36328" /tmp/signature.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Hidden-Treasures-Label-Printer-v1.3.3-EXACT-SIGNER-APK
          path: ht-label-printer-v1.2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
