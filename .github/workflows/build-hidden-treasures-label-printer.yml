name: Build Hidden Treasures Label Printer APK

on:
  workflow_dispatch:
  push:
    branches:
      - agent/hidden-treasures-label-printer-v1.3
    paths:
      - 'ht-label-printer-v1.2/**'
      - '.github/workflows/build-hidden-treasures-label-printer.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore Hidden Treasures signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: hidden-treasures-label-printer-signing-key-v1

      - name: Ensure permanent signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Hidden Treasures Android,O=Hidden Treasures,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -f "$HOME/.android/debug.keystore"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ht-label-printer-v1.2
        run: gradle --no-daemon assembleDebug

      - name: Check signing key
        run: |
          keytool -list -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android >/dev/null
          echo "Hidden Treasures signing key verified"

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose ht-label-printer-v1.2/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hidden-Treasures-Label-Printer-v1.3.1-INSTALL-FIX-APK
          path: ht-label-printer-v1.2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
