plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hiddentreasures.labelprinter'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.hiddentreasures.htlabelprinter.stable'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.3.4'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
